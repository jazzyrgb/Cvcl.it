<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Music</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }
    header {
      background: #1b1b1b;
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #333;
    }
    header h1 {
      margin: 0;
      font-size: 30px;
    }
    header p {
      color: #aaa;
      margin: 6px 0 0;
    }
    .container {
      max-width: 800px;
      margin: auto;
      padding: 25px 15px 100px;
    }
    .search {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: none;
      outline: none;
      margin-bottom: 20px;
      font-size: 16px;
    }
    .song {
      display: flex;
      align-items: center;
      gap: 15px;
      background: #1d1d1d;
      padding: 15px;
      margin-bottom: 12px;
      border-radius: 10px;
    }
    .cover {
      width: 60px;
      height: 60px;
      border-radius: 8px;
      background: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
    }
    .song-info {
      flex: 1;
    }
    .song-info h3 {
      margin: 0 0 5px;
      font-size: 17px;
    }
    .song-info p {
      margin: 0;
      color: #999;
      font-size: 14px;
    }
    button {
      border: none;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      background: white;
      color: black;
      cursor: pointer;
      font-size: 18px;
    }
    button:hover {
      transform: scale(1.05);
    }
    .player {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #202020;
      border-top: 1px solid #333;
      padding: 15px;
      text-align: center;
    }
    audio {
      width: 100%;
      max-width: 700px;
    }
    @media (max-width: 600px) {
      header h1 {
        font-size: 25px;
      }
      .song {
        padding: 12px;
      }
      .cover {
        width: 50px;
        height: 50px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>🎵 My Music</h1>
    <p>Listen to your favorite songs</p>
  </header>
  <main class="container">
    <input
      class="search"
      type="text"
      id="search"
      placeholder="Search songs..."
      onkeyup="searchSongs()"
    >
    <div class="song" data-title="Song One">
      <div class="cover">🎵</div>
      <div class="song-info">
        <h3>Song One</h3>
        <p>Artist One</p>
      </div>
      <button onclick="playSong('songs/song1.mp3')">▶</button>
    </div>
    <div class="song" data-title="Song Two">
      <div class="cover">🎶</div>
      <div class="song-info">
        <h3>Song Two</h3>
        <p>Artist Two</p>
      </div>
      <button onclick="playSong('songs/song2.mp3')">▶</button>
    </div>
    <div class="song" data-title="Song Three">
      <div class="cover">🎧</div>
      <div class="song-info">
        <h3>Song Three</h3>
        <p>Artist Three</p>
      </div>
      <button onclick="playSong('songs/song3.mp3')">▶</button>
    </div>
  </main>
  <div class="player">
    <audio id="audioPlayer" controls></audio>
  </div>
  <script>
    function playSong(song) {
      const player = document.getElementById("audioPlayer");
      player.src = song;
      player.play();
    }
    function searchSongs() {
      const input = document.getElementById("search").value.toLowerCase();
      const songs = document.querySelectorAll(".song");
      songs.forEach(song => {
        const title = song.dataset.title.toLowerCase();
        if (title.includes(input)) {
          song.style.display = "flex";
        } else {
          song.style.display = "none";
        }
      });
    }
  </script>
</body>
</html>
