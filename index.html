
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifica risultati candidato | CVCL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #ffffff;
            color: #333;
            line-height: 1.5;
        }

        /* Top dark purple bar */
        .top-bar {
            background-color: #7a003c;
            color: white;
            font-size: 13px;
            padding: 6px 0;
        }

        .top-bar-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .top-bar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .top-bar a:hover {
            text-decoration: underline;
        }

        /* Header with logos */
        .header {
            background-color: #ffffff;
            border-bottom: 1px solid #e0e0e0;
            padding: 15px 0;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .cvcl-logo {
            background-color: #7a003c;
            color: white;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            flex-shrink: 0;
        }

        .logo-text {
            font-size: 13px;
            line-height: 1.3;
            color: #333;
        }

        .logo-text strong {
            display: block;
            font-size: 14px;
            color: #7a003c;
        }

        .social-links a {
            color: #7a003c;
            margin-left: 12px;
            font-size: 18px;
            text-decoration: none;
        }

        /* Navigation */
        .nav {
            background-color: #ffffff;
            border-bottom: 1px solid #ddd;
            padding: 0;
        }

        .nav-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            padding: 0 10px;
        }

        .nav a {
            color: #333;
            text-decoration: none;
            padding: 14px 16px;
            font-size: 14px;
            display: inline-block;
        }

        .nav a:hover {
            color: #7a003c;
            background-color: #f8f0f4;
        }

        /* Main content */
        .main {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            color: #7a003c;
            font-size: 28px;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .candidate-info {
            margin-bottom: 30px;
            font-size: 15px;
        }

        .candidate-info p {
            margin-bottom: 6px;
        }

        .candidate-info strong {
            display: inline-block;
            width: 140px;
            color: #333;
        }

        .result-box {
            background-color: #f9f9f9;
            border: 1px solid #e0e0e0;
            padding: 18px 22px;
            margin-bottom: 25px;
            border-radius: 4px;
        }

        .result-box .final {
            font-size: 16px;
            margin-bottom: 8px;
        }

        .result-box .score {
            font-size: 16px;
            font-weight: bold;
            color: #7a003c;
        }

        .section-title {
            font-size: 15px;
            margin-bottom: 12px;
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            margin-bottom: 30px;
        }

        table td {
            border: 1px solid #ccc;
            padding: 10px 14px;
        }

        table tr:first-child td {
            background-color: #f5f5f5;
            font-weight: bold;
        }

        .highlight {
            color: #0066cc;
            font-weight: 500;
        }

        /* Logos at bottom of content */
        .cert-logos {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            flex-wrap: wrap;
            margin: 40px 0;
            padding: 20px 0;
        }

        .cert-logos div {
            text-align: center;
            font-size: 12px;
            color: #555;
        }

        /* Footer */
        .footer {
            background-color: #1a1a1a;
            color: #ccc;
            padding: 40px 0 20px;
            font-size: 13px;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 30px;
            padding: 0 20px;
        }

        .footer h4 {
            color: white;
            margin-bottom: 15px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .footer a {
            color: #ccc;
            text-decoration: none;
            display: block;
            margin-bottom: 8px;
        }

        .footer a:hover {
            color: #fff;
        }

        .footer-bottom {
            max-width: 1200px;
            margin: 30px auto 0;
            padding: 15px 20px 0;
            border-top: 1px solid #333;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
        }

        .footer-bottom a {
            color: #999;
            margin-right: 15px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .nav-content {
                justify-content: center;
            }

            .candidate-info strong {
                width: 120px;
            }

            .cert-logos {
                gap: 20px;
            }
        }
    </style>
</head>
